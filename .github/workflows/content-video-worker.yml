name: Render approved content videos
on:
  workflow_dispatch:
  # Run immediately once when this workflow is enabled on main.
  push:
    branches: [main]
    paths:
      - ".github/workflows/content-video-worker.yml"
  # Backup if the website cannot dispatch directly; GitHub may delay/drop cron events.
  # Offset from common high-load quarter-hour boundaries.
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: read
concurrency:
  # Keep a stalled scheduled run from blocking an explicitly requested render.
  # Video claims remain protected by conditional status updates in the app API.
  group: liberty-content-video-worker-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: video-worker
    env:
      CONTENT_VIDEO_API_BASE_URL: ${{ secrets.CONTENT_VIDEO_API_BASE_URL }}
      VIDEO_WORKER_TOKEN: ${{ secrets.VIDEO_WORKER_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # This campaign must NEVER silently fall back to synthetic narration.
      HUMAN_VOICEOVER_VIDEO_ID: cmcf12bd49fdf635e1207b5e
      # A short-lived, PRIVATE, signed URL. Configure in GitHub Actions secrets before queuing.
      HUMAN_VOICEOVER_URL: ${{ secrets.HUMAN_VOICEOVER_URL }}
      KOKORO_VOICE: ${{ vars.KOKORO_VOICE }}
      VIDEO_MUSIC_VOLUME: ${{ vars.VIDEO_MUSIC_VOLUME }}
      VIDEO_BACKGROUND_MUSIC_PATH: ${{ vars.VIDEO_BACKGROUND_MUSIC_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Ensure FFmpeg audio tools
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "FFmpeg already installed"
          else
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Test private human narration intake
        run: node --test tests/human-narration.test.mjs
      - name: Render one approved queued job
        run: npm run worker
