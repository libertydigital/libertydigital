name: Cleanup approved Liberty video branch
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-video-feature-branch.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify merged PR and delete only its exact head branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_TO_REMOVE: feature/content-video-humanized-2026-11-22
          EXPECTED_HEAD: 72ba3e9486fe0c4e3e552fc1d743e178a6ca5dfa
        run: |
          set -euo pipefail
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/9")
          test "$(jq -r '.merged' <<< "$pr")" = true
          test "$(jq -r '.base.ref' <<< "$pr")" = main
          test "$(jq -r '.head.ref' <<< "$pr")" = "$BRANCH_TO_REMOVE"
          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH_TO_REMOVE}")
          test "$(jq -r '.object.sha' <<< "$ref")" = "$EXPECTED_HEAD"
          test "$BRANCH_TO_REMOVE" != main
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH_TO_REMOVE}"
          echo 'Exact merged feature branch deleted; main unchanged.'
